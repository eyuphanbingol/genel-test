<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staj Sınav Çalışması</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tek sütunlu çalışma aracı. Üstte sekmeler, altında kurulum / soru / sonuç ekranları. */
:root {
  --bg: #eef3f3;
  --surface: #ffffff;
  --surface-2: #f5f9f9;
  --ink: #12242b;
  --muted: #566b73;
  --line: #d3dfe1;
  --accent: #0d6b78;
  --accent-ink: #ffffff;
  --accent-soft: #d9eff1;
  --good: #1b7a45;
  --good-soft: #def3e5;
  --bad: #b03020;
  --bad-soft: #fae3de;
  --code-bg: #e6eff0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1e;
    --surface: #15252b;
    --surface-2: #1a2e35;
    --ink: #e5eef0;
    --muted: #94a9b0;
    --line: #2a424b;
    --accent: #52c6d4;
    --accent-ink: #06262b;
    --accent-soft: #123a41;
    --good: #62d595;
    --good-soft: #12331f;
    --bad: #ff8d79;
    --bad-soft: #3b1b15;
    --code-bg: #20373f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1e;
  --surface: #15252b;
  --surface-2: #1a2e35;
  --ink: #e5eef0;
  --muted: #94a9b0;
  --line: #2a424b;
  --accent: #52c6d4;
  --accent-ink: #06262b;
  --accent-soft: #123a41;
  --good: #62d595;
  --good-soft: #12331f;
  --bad: #ff8d79;
  --bad-soft: #3b1b15;
  --code-bg: #20373f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
code {
  font-family: var(--font-mono);
  font-size: .86em;
  background: var(--code-bg);
  padding: 1px 6px;
  border-radius: 5px;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- üst başlık ve sekmeler ---- */
.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand small { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tab { flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); min-width: 0; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .n { font-family: var(--font-mono); font-size: 12px; opacity: .85; margin-left: 4px; }

/* ---- paneller ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 20px; font-weight: 800; }
.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; font-weight: 500; min-width: 0; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .c { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"]::before { content: "✓"; color: var(--accent); font-weight: 700; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: 100%; }
.seg button { flex: 1; border: 0; background: var(--surface-2); padding: 10px 6px; font-weight: 600; border-right: 1px solid var(--line); min-width: 0; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 12px 18px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 17px; padding: 14px 18px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }

.bank { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bank b { font-family: var(--font-display); font-size: 22px; }
.note { color: var(--muted); font-size: 14px; }

/* ---- soru ekranı ---- */
.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .btn { padding: 8px 12px; font-size: 14px; }
.prog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.progtxt { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.progtxt .ok { color: var(--good); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.tag { align-self: flex-start; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 3px 8px; }
.qtext { font-family: var(--font-display); font-size: clamp(19px, 4.6vw, 23px); font-weight: 600; line-height: 1.3; text-wrap: pretty; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.correct { background: var(--good-soft); border-color: var(--good); }
.opt.correct .k { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .6; }
.feedback { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback strong { font-family: var(--font-display); font-size: 18px; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }

/* ---- sonuç ---- */
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { --p: 0; width: 118px; height: 118px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring > div { width: 92px; height: 92px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.score h2 { font-size: 26px; }
.score p { color: var(--muted); }
.cats { display: flex; flex-direction: column; gap: 10px; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.catrow .bar { grid-column: 1 / -1; }
.catrow span:last-child { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.wlist { display: flex; flex-direction: column; gap: 10px; }
.witem { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.witem .q { font-weight: 600; overflow-wrap: anywhere; }
.witem .a { color: var(--good); overflow-wrap: anywhere; }
.witem .a b { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.witem .e { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

/* ---- sözlü kartlar ---- */
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sq { font-family: var(--font-display); font-size: clamp(20px, 5vw, 25px); font-weight: 600; line-height: 1.28; text-wrap: pretty; }
.sa { border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 12px 12px 0; padding: 14px 16px; overflow-wrap: anywhere; }
.sa .label { display: block; margin-bottom: 6px; }
.nav { display: flex; gap: 8px; }
.nav .btn { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head>

<script>

  if (S.tab === "sozlu") body = viewSozlu();
  else if (S.view === "quiz") body = viewQuiz();
  else if (S.view === "result") body = viewResult();
  else body = viewHome();
  app.innerHTML = (S.view === "quiz" && S.tab === "test" ? "" : head()) + body;
}

function poolSize() {
  return ALL.filter(q => S.cats.has(q.cat)).length;
}

function viewHome() {
  const c = counts();
  const n = poolSize();
  const eff = S.count === 0 ? n : Math.min(S.count, n);
  const last = S.last
    ? `<p class="note">Son test: <b>${S.last.score} / ${S.last.total}</b> (%${S.last.pct})</p>` : "";
  return `
  <section class="panel">
    <h2>Test ayarları</h2>
    <div class="row" style="flex-direction:column;gap:8px">
      <span class="label">Konular</span>
      <div class="row">
        ${CAT_KEYS.map(k => `<button class="chip" data-act="cat" data-v="${k}" aria-pressed="${S.cats.has(k)}">${CATS[k]} <span class="c">${c[k]}</span></button>`).join("")}
      </div>
    </div>
    <div class="row" style="flex-direction:column;gap:8px">
      <span class="label">Soru sayısı</span>
      <div class="seg" role="group" aria-label="Soru sayısı">
        ${[25, 50, 100, 0].map(v => `<button data-act="count" data-v="${v}" aria-pressed="${S.count === v}">${v === 0 ? "Hepsi" : v}</button>`).join("")}
      </div>
    </div>
    <label class="check"><input type="checkbox" id="mix" ${S.mix ? "checked" : ""}> Soruları karıştır</label>
    <button class="btn primary block" data-act="start" ${n === 0 ? "disabled" : ""}>Testi başlat (${eff} soru)</button>
    ${last}
  </section>

  <section class="panel">
    <div class="bank">
      <div>
        <span class="label">Yanlışlarım</span><br>
        <b>${S.wrong.size}</b> <span class="note">soru bekliyor</span>
      </div>
      <div class="row">
        <button class="btn" data-act="startWrong" ${S.wrong.size === 0 ? "disabled" : ""}>Yanlışları çöz</button>
        <button class="btn ghost" data-act="clearWrong" ${S.wrong.size === 0 ? "disabled" : ""}>Temizle</button>
      </div>
    </div>
    <p class="note">Yanlış cevapladığın sorular burada birikir. Doğru cevaplayınca listeden çıkar.</p>
  </section>`;
}

function buildQuestion(q) {
  const opts = shuffle([{ t: q.a, ok: true }, ...q.w.map(t => ({ t, ok: false }))]);
  return { ...q, opts };
}

function startQuiz(pool, source) {
  let list = S.mix ? shuffle(pool) : pool.slice();
  if (source === "normal" && S.count > 0) list = list.slice(0, S.count);
  Z = { list: list.map(buildQuestion), i: 0, picked: null, score: 0, misses: [], perCat: {}, source };
  S.view = "quiz";
  render();
  window.scrollTo(0, 0);
}

function viewQuiz() {
  const q = Z.list[Z.i];
  const total = Z.list.length;
  const done = Z.picked !== null;
  const pct = Math.round((Z.i + (done ? 1 : 0)) / total * 100);
  const right = done && Z.picked !== null && q.opts[Z.picked].ok;
  return `
  <div class="qhead">
    <button class="btn" data-act="quit">Çık</button>
    <div class="prog">
      <div class="progtxt"><span>${Z.i + 1} / ${total}</span><span class="ok">${Z.score} doğru</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
  </div>
  <section class="qcard">
    <span class="tag">${CATS[q.cat]}</span>
    <div class="qtext">${fmt(q.q)}</div>
    <div class="opts">
      ${q.opts.map((o, k) => {
        let cls = "opt";
        if (done) { if (o.ok) cls += " correct"; else if (k === Z.picked) cls += " wrong"; else cls += " dim"; }
        return `<button class="${cls}" data-act="pick" data-v="${k}" ${done ? "disabled" : ""}><span class="k">${LETTERS[k]}</span><span class="t">${fmt(o.t)}</span></button>`;
      }).join("")}
    </div>
    ${done ? `
    <div class="feedback ${right ? "good" : "bad"}" role="status">
      <strong>${right ? "Doğru" : "Yanlış"}</strong>
      <span>${fmt(q.e)}</span>
    </div>
    <button class="btn primary block" data-act="next">${Z.i + 1 === total ? "Sonucu gör" : "Sonraki soru"}</button>` : ""}
  </section>`;
}

function pick(k) {
  if (!Z || Z.picked !== null) return;
  const q = Z.list[Z.i];
  Z.picked = k;
  const ok = q.opts[k].ok;
  Z.perCat[q.cat] = Z.perCat[q.cat] || { r: 0, t: 0 };
  Z.perCat[q.cat].t++;
  if (ok) { Z.score++; Z.perCat[q.cat].r++; S.wrong.delete(q.id); }
  else { Z.misses.push(q); S.wrong.add(q.id); }
  store.set("wrong", Array.from(S.wrong));
  render();
}

function next() {
  if (!Z || Z.picked === null) return;
  if (Z.i + 1 >= Z.list.length) { finish(); return; }
  Z.i++; Z.picked = null;
  render();
  window.scrollTo(0, 0);
}

function finish() {
  const total = Z.list.length;
  const pct = Math.round(Z.score / total * 100);
  if (Z.source !== "wrong") { S.last = { score: Z.score, total, pct }; store.set("last", S.last); }
  S.view = "result";
  render();
  window.scrollTo(0, 0);
}

function verdict(p) {
  if (p >= 90) return ["Çok iyi", "Sınava hazır görünüyorsun."];
  if (p >= 70) return ["İyi", "Yanlışlarına bir bak, tamamdır."];
  if (p >= 50) return ["Orta", "Zayıf konuları defterden tekrar oku."];
  return ["Biraz daha çalış", "Çalışma kağıdını oku, sonra testi yeniden çöz."];
}

function viewResult() {
  const total = Z.list.length;
  const pct = Math.round(Z.score / total * 100);
  const v = verdict(pct);
  const cats = CAT_KEYS.filter(k => Z.perCat[k]);
  return `
  <section class="panel">
    <div class="score">
      <div class="ring" style="--p:${pct}"><div>%${pct}</div></div>
      <div>
        <h2>${Z.score} / ${total} doğru</h2>
        <p><b>${v[0]}.</b> ${v[1]}</p>
      </div>
    </div>
    <div class="cats">
      ${cats.map(k => { const c = Z.perCat[k]; const p = Math.round(c.r / c.t * 100); return `
        <div class="catrow"><span>${CATS[k]}</span><span>${c.r} / ${c.t}</span><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join("")}
    </div>
    <div class="row">
      ${Z.misses.length ? `<button class="btn primary" data-act="retry">Yanlışları tekrar çöz (${Z.misses.length})</button>` : ""}
      <button class="btn" data-act="home">Yeni test</button>
    </div>
  </section>
  ${Z.misses.length ? `
  <section class="panel">
    <h2>Yanlış yaptıkların</h2>
    <div class="wlist">
      ${Z.misses.map(q => `
      <div class="witem">
        <div class="q">${fmt(q.q)}</div>
        <div class="a"><b>Doğru cevap</b><br>${fmt(q.a)}</div>
        <div class="e">${fmt(q.e)}</div>
      </div>`).join("")}
    </div>
  </section>` : ""}`;
}

/* ---- sözlü ---- */
function sozluTopics() { return ["Hepsi", ...Array.from(new Set(SOZLU.map(s => s[0])))]; }

function viewSozlu() {
  const list = S.sozluList;
  const s = list[S.sozluI];
  return `
  <section class="panel">
    <h2>Sözlü sınav soruları</h2>
    <p class="note">Önce soruyu sesli cevapla, sonra cevabı aç ve karşılaştır. Cevaplar kendi ağzından, defterdeki bilgilere göre yazıldı.</p>
    <div class="row">
      ${sozluTopics().map(t => `<button class="chip" data-act="stopic" data-v="${t}" aria-pressed="${S.sozluCat === t}">${t}</button>`).join("")}
    </div>
  </section>
  ${list.length === 0 ? `<div class="empty">Bu konuda soru yok.</div>` : `
  <div class="progtxt" style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--muted)"><span>${S.sozluI + 1} / ${list.length}</span><span>${esc(s[0])}</span></div>
  <section class="scard">
    <div class="sq">${fmt(s[1])}</div>
    ${S.sozluOpen
      ? `<div class="sa"><span class="label">Örnek cevap</span>${fmt(s[2])}</div>`
      : `<button class="btn primary block" data-act="sopen">Cevabı göster</button>`}
    <div class="nav">
      <button class="btn" data-act="sprev" ${S.sozluI === 0 ? "disabled" : ""}>Önceki</button>
      <button class="btn" data-act="sshuffle">Karıştır</button>
      <button class="btn" data-act="snext" ${S.sozluI >= list.length - 1 ? "disabled" : ""}>Sonraki</button>
    </div>
  </section>`}`;
}

function setSozlu(topic) {
  S.sozluCat = topic;
  S.sozluList = topic === "Hepsi" ? SOZLU.slice() : SOZLU.filter(s => s[0] === topic);
  S.sozluI = 0; S.sozluOpen = false;
}

/* ================== Olaylar ================== */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case "tab": S.tab = v; if (v === "test" && S.view === "quiz") S.view = "home"; render(); break;
    case "cat":
      if (S.cats.has(v)) { if (S.cats.size > 1) S.cats.delete(v); } else S.cats.add(v);
      render(); break;
    case "count": S.count = Number(v); render(); break;
    case "start": startQuiz(ALL.filter(q => S.cats.has(q.cat)), "normal"); break;
    case "startWrong": startQuiz(ALL.filter(q => S.wrong.has(q.id)), "wrong"); break;
    case "clearWrong": S.wrong.clear(); store.set("wrong", []); render(); break;
    case "pick": pick(Number(v)); break;
    case "next": next(); break;
    case "quit": Z = null; S.view = "home"; render(); break;
    case "retry": startQuiz(Z.misses.map(m => ALL[m.id]), "retry"); break;
    case "home": Z = null; S.view = "home"; render(); break;
    case "stopic": setSozlu(v); render(); break;
    case "sopen": S.sozluOpen = true; render(); break;
    case "sprev": if (S.sozluI > 0) { S.sozluI--; S.sozluOpen = false; render(); } break;
    case "snext": if (S.sozluI < S.sozluList.length - 1) { S.sozluI++; S.sozluOpen = false; render(); } break;
    case "sshuffle": S.sozluList = shuffle(S.sozluList); S.sozluI = 0; S.sozluOpen = false; render(); break;
  }
});
app.addEventListener("change", e => {
  if (e.target.id === "mix") S.mix = e.target.checked;
});
document.addEventListener("keydown", e => {
  if (S.tab !== "test" || S.view !== "quiz" || !Z) return;
  if (["1", "2", "3", "4"].includes(e.key) && Z.picked === null) pick(Number(e.key) - 1);
  else if (e.key === "Enter" && Z.picked !== null) { e.preventDefault(); next(); }
});

render();
</script>
</body>
</html>
